name: Deploy and Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build Frontend & Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          GITHUB_ACTIONS: true

      - name: Run smoke tests
        run: |
          echo "✅ Build output exists"
          test -d frontend/dist
          test -f frontend/dist/index.html
          echo "✅ All smoke tests passed"

      - name: Install openpyxl
        if: always()
        run: python3 -m pip install --quiet openpyxl

      - name: Generate Excel deploy report
        if: always()
        run: python3 scripts/generate_deploy_report.py

      - name: Upload deploy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-test-report
          path: test-output/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
