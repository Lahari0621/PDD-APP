# JVM memory — prevents GC thrashing during build
org.gradle.jvmargs=-Xmx4096m -Xms1024m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Gradle performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Android
android.useAndroidX=true
android.enableJetifier=false

# Suppress compileSdk warning (AGP 8.7.3 supports compileSdk 35)
android.suppressUnsupportedCompileSdk=35

# Disable GC warning spam
org.gradle.daemon.performance.disable-logging=true
